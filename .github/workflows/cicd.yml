name: Income Model CI/CD
run-name: ${{ github.event.head_commit.message || inputs.run_name || github.workflow }}

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'data/*.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:
    inputs:
      run_name:
        description: Run title for manual recovery
        required: false
        type: string
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  SERVER_SECURITY_GROUP: sg-0567a121b48cfb400

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure DagsHub MLflow tracking
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          if [ -n "$DAGSHUB_USER_TOKEN" ]; then
            echo "MLFLOW_TRACKING_URI=https://dagshub.com/dinhngocduc1311/K4-L3-DAY21-DinhNgocDuc-2A202602935-CI-CD-for-AI-Systems.mlflow" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_USERNAME=dinhngocduc1311" >> "$GITHUB_ENV"
            printf 'MLFLOW_TRACKING_PASSWORD=%s\n' "$DAGSHUB_USER_TOKEN" >> "$GITHUB_ENV"
          else
            echo "DAGSHUB_USER_TOKEN is not configured; using local MLflow tracking."
          fi
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
      - name: Save training outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            models/model.joblib
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prevent model regression
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          NEW_F1: ${{ needs.train.outputs.f1 }}
        run: |
          set +e
          aws s3api head-object \
            --bucket "$ARTIFACT_BUCKET" \
            --key artifacts/current/report.json \
            >/dev/null 2>/tmp/head-error
          HEAD_STATUS=$?
          set -e
          if [ "$HEAD_STATUS" -eq 0 ]; then
            aws s3 cp "s3://$ARTIFACT_BUCKET/artifacts/current/report.json" /tmp/current-report.json
            python - <<'PYEOF'
          import json
          import os

          new_f1 = float(os.environ["NEW_F1"])
          with open("/tmp/current-report.json") as report_file:
              current_f1 = float(json.load(report_file)["f1_score"])
          print(f"Model comparison: new={new_f1:.4f}, current={current_f1:.4f}")
          if new_f1 < current_f1:
              raise SystemExit("FAILED: new model is worse. Deployment cancelled.")
          print("PASSED: new model is at least as good as the deployed model.")
          PYEOF
          elif grep -Eq '404|Not Found|NoSuchKey' /tmp/head-error; then
            echo "No deployed report found; allowing the first versioned deployment."
          else
            cat /tmp/head-error >&2
            exit "$HEAD_STATUS"
          fi

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Download training outputs
        uses: actions/download-artifact@v4
        with:
          name: report
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish approved model and reports
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          aws s3 cp models/model.joblib "s3://$ARTIFACT_BUCKET/artifacts/current/model.joblib" --sse AES256
          aws s3 cp outputs/report.json "s3://$ARTIFACT_BUCKET/artifacts/current/report.json" --sse AES256
          aws s3 cp outputs/detail.txt "s3://$ARTIFACT_BUCKET/artifacts/current/detail.txt" --sse AES256
      - name: Allow runner SSH
        id: ssh_cidr
        run: |
          CIDR="$(curl -fsS https://checkip.amazonaws.com)/32"
          echo "cidr=$CIDR" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SERVER_SECURITY_GROUP" \
            --protocol tcp --port 22 --cidr "$CIDR"
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
      - name: Revoke runner SSH
        if: always() && steps.ssh_cidr.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SERVER_SECURITY_GROUP" \
            --protocol tcp --port 22 --cidr "${{ steps.ssh_cidr.outputs.cidr }}"
